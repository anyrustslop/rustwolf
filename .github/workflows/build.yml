name: Build RustWolf

# - push to main: build check only
# - tag vX.Y.Z:  build + versioned release (RustWolf .exe, checksums, release notes, source code)
# - weekly:      update dependencies (Servo + security fixes), build + release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write
  id-token: write       # signed build provenance (Sigstore)
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Update dependencies (weekly runs)
        if: github.event_name == 'schedule'
        run: cargo update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rustwolf-${{ hashFiles('Cargo.lock') }}
          restore-keys: rustwolf-

      - name: Check RustWolf's patched crates are used
        shell: pwsh
        run: |
          # If a dependency update ever pulled in an upstream copy of a crate RustWolf patches
          # (see patches/), its protections would silently disappear. Refuse to build then.
          $m = cargo metadata --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { $m = cargo metadata --format-version 1 | ConvertFrom-Json }
          $bad = @()
          foreach ($name in "servo", "servo-net", "servo-storage", "servo-fonts", "ipc-channel", "num_cpus", "rustwolf-shared") {
            $pkgs = @($m.packages | Where-Object { $_.name -eq $name })
            if ($pkgs.Count -eq 0) { $bad += "$name (missing)" }
            foreach ($p in $pkgs) { if ($p.source) { $bad += "$name $($p.version) from $($p.source)" } }
          }
          if ($bad.Count) {
            Write-Output "::error title=Patched crate not used::$($bad -join ' | ')"
            exit 1
          }
          Write-Output "All patched crates come from patches/."

      - name: Build
        run: cargo build --release

      - name: Install cargo-audit
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit of all Rust dependencies (RustSec advisories)
        continue-on-error: true
        run: cargo audit

      - name: Version
        id: v
        shell: pwsh
        run: |
          $base = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = $env:GITHUB_REF_NAME.TrimStart('v'); $tag = $env:GITHUB_REF_NAME }
          else { $ver = "$base-weekly." + (Get-Date -Format "yyyyMMdd"); $tag = "v$ver" }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.v.outputs.version }}"
          Copy-Item target/release/RustWolf.exe "RustWolf-$ver-win64.exe"
          $h = Get-FileHash "RustWolf-$ver-win64.exe" -Algorithm SHA256
          "$($h.Hash.ToLower())  RustWolf-$ver-win64.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
          (Get-Content .github/release-notes.md -Raw).Replace('VERSION', $ver).Replace('COMMIT', $env:GITHUB_SHA) | Set-Content notes.md -Encoding utf8

      - name: Signed build provenance
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: RustWolf-${{ steps.v.outputs.version }}-win64.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ steps.v.outputs.version }}"; $tag = "${{ steps.v.outputs.tag }}"
          $extra = @()
          # Weekly / manual builds create their own tag and are pre-releases: "latest" (and so
          # RustWolf's auto-update) always stays on a real version release.
          if ($env:GITHUB_REF -notlike "refs/tags/v*") { $extra = @("--target", $env:GITHUB_SHA, "--prerelease") }
          $out = gh release create $tag "RustWolf-$ver-win64.exe" SHA256SUMS.txt --title "RustWolf $ver" --notes-file notes.md @extra 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) {
            # Make the reason visible on the run page without needing to open the logs.
            $msg = (($out | Out-String).Trim() -replace "`r?`n", " | ")
            Write-Output "::error title=Publishing the release failed::$msg"
            exit $code
          }
