[package]
name = "rustwolf"
version = "0.5.1"
edition = "2021"
description = "RustWolf - a privacy-first web browser written in Rust, on the Servo engine"
license = "MPL-2.0"
publish = false

[[bin]]
name = "RustWolf"
path = "src/main.rs"

[dependencies]
servo = "0.8.0"
winit = "0.30.13"
egui = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false, features = ["clipboard", "links"] }
egui_glow = { version = "0.34.3", features = ["winit"] }
glow = "0.17"
euclid = "0.22"
url = "2.5"
http = "1"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }
ureq = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
arboard = "3"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# Servo's network crate with one fix (bigger HTTP/2 header limit, see patches/servo-net/connector.rs).
[patch.crates-io]
servo-net = { path = "patches/servo-net" }
